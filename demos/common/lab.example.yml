---
# Your lab, in one file: credentials, management addresses and topology.
#
#   cp lab.example.yml lab.yml
#
# lab.yml is gitignored. This example is not, so never put anything real in here.
#
# Every demo notebook reads lab.yml from this folder and passes it to every
# playbook and router cell as "-e @lab.yml". In a terminal, add that flag yourself
# (see demos/README.md). Anything you leave out comes from the repo's
# deploy/c8000/automation/group_vars/all/ (lab.yml, topology.yml), so you can keep
# only the keys you change. One catch: a key you DO set replaces the repo's value
# whole. Set lab_mgmt with only r1 in it and r2 and r3 are gone.
#
# Every secret below is a placeholder or a throwaway lab value. None of them are
# secure and none are meant to be. Don't reuse any of them, and don't build them
# out of a password you actually use.

# --- Access -------------------------------------------------------------------

# Management addresses of the three routers, reachable over SSH from your laptop.
lab_mgmt:
  r1: 192.0.2.11
  r2: 192.0.2.12
  r3: 192.0.2.13

lab_user: admin
lab_password: changeme
# Only needed if your enable secret differs from the login password.
# lab_enable_password: changeme

# --- Throwaway crypto material (the playbooks in Act 3 use these) --------------

# IKEv2 pre-shared key for the classical IPsec baseline.
lab_ikev2_psk: replace-me-ikev2-psk

# RFC 8784 post-quantum pre-shared key, as the hex encoding of an ASCII string
# (IOS XE rejects raw "openssl rand -hex 32" bytes). Generate with:
#   python3 -c "import secrets,string; s=''.join(secrets.choice(string.ascii_letters+string.digits) for _ in range(32)); print(s, s.encode().hex())"
lab_ppk_hex: 48656C6C6F506F737451756172746E756D

# MACsec CAK for the PSK path, 64 hex characters. Generate with: openssl rand -hex 32
lab_macsec_cak: "1234567890123456789012345678901234567890123456789012345678901234"

# Password protecting the CA private key on R2's local certificate server
# (MACsec EAP-TLS). IOS XE wants more than 7 characters.
lab_ca_passphrase: replace-me-ca-passphrase-8chars

# --- Topology -----------------------------------------------------------------
#
# * lab_topology: underlay_* per router, and source_interface / local_address /
#   remote_address per peer. The IPsec Tunnel0 addresses in ipsec.md stay fixed.
# * macsec_interface: the two ends of the direct R1 to R2 wire.
# * macsec_command: only for a routed MACsec port, which takes plain "macsec".
#
# The EAP-TLS demo's CA URL comes from R2's local_address toward R1, so there's
# nothing to repeat for it.
#
# This example keeps the repo's addresses and changes only the interface names,
# for routers with routed-only ports: R1 on a routed port, R2 on its SVIs, R3 on
# an 802.1Q subinterface. Using the repo's SVI layout as is? Delete this section.
#
#   R1 Fi0/0/0 10.0.12.1 ---- 10.0.12.2 Vlan12 R2 Vlan23 10.0.23.1 ---- 10.0.23.2 Gi0/0/3.23 R3
#           (Tw0/0/0 on R2, access VLAN 12)

lab_topology:

  r1:
    underlay_interface: FiveGigabitEthernet0/0/0
    underlay_address: 10.0.12.1
    peers:
      - name: r2
        role: hub
        tunnel_id: 101
        tunnel_address: 192.168.101.1
        tunnel_mask: 255.255.255.0
        source_interface: FiveGigabitEthernet0/0/0
        local_address: 10.0.12.1
        remote_address: 10.0.12.2

  r2:
    underlay_interface: Vlan12
    underlay_address: 10.0.12.2
    peers:
      - name: r1
        role: spoke
        tunnel_id: 101
        tunnel_address: 192.168.101.2
        tunnel_mask: 255.255.255.0
        source_interface: Vlan12
        local_address: 10.0.12.2
        remote_address: 10.0.12.1
      - name: r3
        role: spoke
        tunnel_id: 102
        tunnel_address: 192.168.102.1
        tunnel_mask: 255.255.255.0
        source_interface: Vlan23
        local_address: 10.0.23.1
        remote_address: 10.0.23.2

  r3:
    underlay_interface: GigabitEthernet0/0/3.23
    underlay_address: 10.0.23.2
    peers:
      - name: r2
        role: hub
        tunnel_id: 102
        tunnel_address: 192.168.102.2
        tunnel_mask: 255.255.255.0
        source_interface: GigabitEthernet0/0/3.23
        local_address: 10.0.23.2
        remote_address: 10.0.23.1

# MACsec is hop-by-hop: it needs the physical R1 to R2 link. Here R1's end is the
# routed underlay port itself, and R2's end is the access port in VLAN 12.
macsec_interface:
  r1: FiveGigabitEthernet0/0/0
  r2: TwoGigabitEthernet0/0/0

# A routed port rejects "macsec network-link" and takes plain "macsec", its
# peer-to-peer mode. Leave a switchport out of this map: it gets network-link.
macsec_command:
  r1: macsec
