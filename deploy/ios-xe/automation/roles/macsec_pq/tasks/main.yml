---
# Put ML-KEM inside the EAP-TLS handshake that keys MACsec.
#
# The smallest role in this directory and the biggest single win in it. Two leaves. All
# the work was in macsec-eaptls, which replaced a static secret with a TLS 1.3
# handshake; this decides which key exchange that handshake uses.
#
# Idempotent. Setting the same two enums twice is a no-op.
#
# Stacks on macsec-eaptls, never on macsec-psk. A PSK session has no handshake at all,
# so there is nothing here for these leaves to steer, and they would apply silently and
# do nothing.

- name: MACsec PQ | sanity
  ansible.builtin.assert:
    that:
      - pq_macsec_type in ['pqc', 'non-pqc', 'hybrid', 'all']
      - pq_macsec_tls_version in ['1.2', '1.3', 'all']
    fail_msg: >-
      pq_macsec_type must be one of pqc, non-pqc, hybrid or all, and
      pq_macsec_tls_version one of 1.2, 1.3 or all. Got "{{ pq_macsec_type }}" and
      "{{ pq_macsec_tls_version }}".
    quiet: true

# Refuse to apply this to a PSK-keyed link. The leaves would take, the config would look
# right, and nothing would change, which is worse than an error.
- name: MACsec PQ | check the link is keyed by EAP-TLS
  cisco.ios.ios_command:
    commands:
      - "show running-config interface {{ my_macsec_interface }}"
  register: macsec_pq_iface
  changed_when: false
  when: state == 'present'

- name: MACsec PQ | abort if the link is keyed by a pre-shared key
  ansible.builtin.assert:
    that:
      - (macsec_pq_iface.stdout[0] | default('')) is not search('mka pre-shared-key')
      - (macsec_pq_iface.stdout[0] | default('')) is search('dot1x pae both')
    fail_msg: >-
      {{ my_macsec_interface }} on {{ inventory_hostname }} is not keyed by EAP-TLS.
      This overlay only means something on top of macsec-eaptls: a pre-shared-key
      session has no handshake for ML-KEM to go into, so these settings would apply and
      change nothing. Tear the PSK down and build the EAP-TLS path first:
      "ansible-playbook macsec-psk.yml -e state=absent" then
      "ansible-playbook macsec-eaptls.yml".
    quiet: true
  when: state == 'present'

- name: MACsec PQ | render
  ansible.builtin.set_fact:
    nc_label: >-
      {{ (state == 'present')
         | ternary('access-session pqc-type ' ~ pq_macsec_type ~ ', TLS ' ~ pq_macsec_tls_version,
                   'access-session back to classical defaults') }}
    nc_operation: merge
    nc_payload: "{{ lookup('template', 'macsec-pq.xml.j2') }}"

- name: MACsec PQ | push
  ansible.builtin.include_role:
    name: common
    tasks_from: netconf-edit

# The knobs only take effect on the next EAP-TLS handshake. Forcing one is how you avoid
# reading a stale session and concluding nothing happened.
#
# ESCAPE HATCH: network_cli. Exec-mode action, no rpc in the model.
#
# Gated on the push above, for the same reason the IPsec roles gate
# "clear crypto ikev2 sa": an action task is always "changed", so unconditionally
# clearing the session made changed=0 impossible on a second run. It is not free
# either. Clearing the access-session drops the MACsec link and costs roughly two
# minutes of EAP-TLS thrash before it settles, so re-running this playbook to check
# the posture should not knock the link over to tell you nothing moved.
- name: MACsec PQ | force a re-authentication so the new handshake is used
  cisco.ios.ios_command:
    commands:
      - "clear access-session interface {{ my_macsec_interface }}"
  when: netconf_edit_result.changed | default(false)
  changed_when: true

- name: MACsec PQ | note what to check
  ansible.builtin.debug:
    msg: >-
      Re-authentication forced. A cold EAP-TLS start thrashes for around two minutes
      before it settles, so give it that before believing "show mka sessions". And never
      accept Secured as proof of encryption: check that Out Pkts Encrypted is actually
      moving, which is what verify.yml reports.
  when: netconf_edit_result.changed | default(false)

- name: MACsec PQ | save
  ansible.builtin.include_role:
    name: common
    tasks_from: save-config
