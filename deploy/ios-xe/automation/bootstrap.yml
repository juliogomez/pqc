---
# Enable NETCONF (RFC 6241) and RESTCONF (RFC 8040) on all three routers.
#
# Run this once, first. Everything else in this directory assumes port 830
# answers.
#
#   ansible-playbook bootstrap.yml
#   ansible-playbook bootstrap.yml -e state=absent      # last, if ever
#
# Basic connectivity (VLANs, SVIs, routing) is a precondition and is never
# configured here. Build it from ipsec.md Exercise 1 first.

- name: Bootstrap the standard management transports
  hosts: routers
  gather_facts: false
  connection: ansible.netcommon.network_cli
  roles:
    - role: bootstrap
