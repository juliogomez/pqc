---
# The three C8235-G2 routers from the lab topology in ../README.md.
#
# Management addresses and credentials are NOT here. They come from
# group_vars/all/lab.yml, which you create by copying lab.yml.example.
# That keeps this file safe to commit and keeps your addresses out of git.

all:
  children:
    routers:
      vars:
        ansible_host: "{{ lab_mgmt[inventory_hostname] }}"
        ansible_network_os: cisco.ios.ios
        ansible_user: "{{ lab_user }}"
        ansible_password: "{{ lab_password }}"
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ lab_enable_password | default(lab_password) }}"

      children:
        # One IKEv2 profile per spoke lives on the hub. That asymmetry is the
        # thing the per-peer loops in roles/ipsec_baseline exist to absorb.
        hub:
          hosts:
            r2:

        spokes:
          hosts:
            r1:
            r3:

    # MACsec in these labs runs on the R1 to R2 link only, and R2 additionally
    # hosts the local CA for the EAP-TLS path.
    macsec_pair:
      hosts:
        r1:
        r2:

    macsec_ca:
      hosts:
        r2:
