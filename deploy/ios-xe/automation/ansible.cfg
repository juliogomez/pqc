[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
# ansible-core removed the bundled 'yaml' stdout callback in 2.19 (deprecated
# in 2.16). requirements.txt allows ansible-core>=2.18, so requesting it here
# hard-fails the run on any modern core with:
#   [ERROR]: Could not load 'yaml' callback plugin.
# 'default' is built in and needs no extra collection.
# pqc_lab (callback_plugins/) is default minus PLAY RECAP on exit 0.
stdout_callback = pqc_lab
callback_plugins = ./callback_plugins
display_skipped_hosts = False
# Pre-flight probes and NETCONF reads are not the story; hide ok tasks so a
# mutual-exclusion refusal surfaces as one visible failure, not six green lines.
display_ok_hosts = False
retry_files_enabled = False
interpreter_python = auto_silent

# Roles live next to the playbooks, one per unit.
roles_path = roles

[persistent_connection]
# IOS XE crypto operations are slow. IKEv2 renegotiation, MACsec EAP cold start
# and NETCONF subsystem restarts all blow past the 30s default.
command_timeout = 180
connect_timeout = 60
connect_retry_timeout = 30

[paramiko_connection]
look_for_keys = False
# [defaults] host_key_checking above does not reach the paramiko transport that
# network_cli falls back to without ansible-pylibssh, so a router whose host key
# was legitimately rotated (rebuild, RMA, console recovery) fails the run with
#   host key mismatch for <ip>
# even though the repo intends host key checking to be off for these lab boxes.
host_key_checking = False
