[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
stdout_callback = pqc_lab
callback_plugins = ./callback_plugins
display_skipped_hosts = False
display_ok_hosts = False
retry_files_enabled = False
interpreter_python = auto_silent
roles_path = roles

[inventory]
# A host pattern that matches nothing is a typo, not a no-op. Fail on it instead
# of printing a warning and reporting a green run that configured zero devices.
host_pattern_mismatch = error

[persistent_connection]
command_timeout = 180
connect_timeout = 60
connect_retry_timeout = 30

[paramiko_connection]
look_for_keys = False
host_key_checking = False
