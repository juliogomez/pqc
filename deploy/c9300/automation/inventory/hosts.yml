---
# The C9300 lab devices.
#
# Management addresses and credentials are NOT here. They come from
# group_vars/all/lab.yml, which you create by copying lab.yml.example.
# That keeps this file safe to commit and keeps your addresses out of git.

all:
  children:
    # All managed devices share the same connection and credential vars.
    #
    # The "unset.invalid" fallback is never connected to. Ansible templates
    # ansible_host for every task, including controller-side ones, so a device
    # missing from lab_mgmt would otherwise blow up before the roles get a chance
    # to skip it. Each role starts with common/tasks/skip-unaddressed.yml, which
    # ends the play for exactly these hosts. (.invalid is reserved by RFC 2606 and
    # can never resolve, so a mistake here fails loudly rather than reaching a real
    # box.)
    switches:
      vars:
        ansible_host: "{{ lab_mgmt[inventory_hostname] | default('unset.invalid') }}"
        ansible_network_os: cisco.ios.ios
        ansible_user: "{{ lab_user }}"
        ansible_password: "{{ lab_password }}"
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ lab_enable_password | default(lab_password) }}"

      hosts:
        sw1:            # bfl-cpoc-e13-c9300-48-01 (C9300-48H, switch-to-router + host-to-switch)
        sw2:            # bfl-cpoc-e13-c9300-48-02 (C9300-48H, stands in for the host in Exercise 4)
        hx1:            # C9300-1 (IPsec, SSH, TLS, switch-to-switch MACsec) [not in this lab]
        hx2:            # C9300-2 (IPsec and MACsec peer for hx1) [not in this lab]

    routers:
      vars:
        ansible_host: "{{ lab_mgmt[inventory_hostname] | default('unset.invalid') }}"
        ansible_network_os: cisco.ios.ios
        ansible_user: "{{ lab_user }}"
        ansible_password: "{{ lab_password }}"
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ lab_enable_password | default(lab_password) }}"

      hosts:
        rtr1:           # bfl-cpoc-d14-8235-01 (C8235-G2, MACsec peer for sw1)

    # Protocol-specific groups reference the same hosts.
    #
    # One group per MACsec link, and the MACsec playbooks make you name one:
    # -e macsec_play_hosts=macsec_s2r | macsec_s2s | macsec_h2s.
    #
    # There is deliberately no group that combines them. sw1 sits on two of these
    # links, and a play can only drive one interface per host, so a combined
    # target would silently configure the wrong port.
    macsec_s2r:
      hosts:
        sw1:            # Gi1/0/48
        rtr1:           # Tw0/0/4

    macsec_s2s:
      hosts:
        hx1:            # Te1/0/6
        hx2:            # Te1/0/6

    macsec_h2s:
      hosts:
        sw1:            # Gi1/0/1
        sw2:            # Gi2/0/1

    ipsec_pair:
      hosts:
        sw1:            # Routed underlay: sw1→rtr1→rtr2→rtr3→sw2
        sw2:            # Routed underlay: sw2→rtr3→rtr2→rtr1→sw1
