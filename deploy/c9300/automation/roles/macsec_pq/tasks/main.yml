---
# Put ML-KEM inside the EAP-TLS handshake that keys MACsec.
#
# The smallest role in this directory and the biggest single win in it. Two leaves. All
# the work was in macsec-eaptls, which replaced a static secret with a TLS 1.3
# handshake; this decides which key exchange that handshake uses.
#
# Idempotent. Setting the same two enums twice is a no-op.
#
# Stacks on macsec-eaptls, never on macsec-psk. A PSK session has no handshake at all,
# so there is nothing here for these leaves to steer, and they would apply silently and
# do nothing.

- name: MACsec PQ | skip devices with no management address
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/skip-unaddressed.yml"

- name: MACsec PQ | both ends of the link must be reachable
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/assert-link-manageable.yml"

- name: MACsec PQ | sanity
  ansible.builtin.assert:
    that:
      - my_macsec_pq_type in ['pqc', 'non-pqc', 'hybrid', 'all']
      - pq_macsec_tls_version in ['1.2', '1.3', 'all']
    fail_msg: >-
      my_macsec_pq_type must be one of pqc, non-pqc, hybrid or all, and
      pq_macsec_tls_version one of 1.2, 1.3 or all. Got "{{ my_macsec_pq_type }}" and
      "{{ pq_macsec_tls_version }}".
    quiet: true

# Refuse to apply this to a PSK-keyed link. The leaves would take, the config would look
# right, and nothing would change, which is worse than an error.
- name: MACsec PQ | check the link is keyed by EAP-TLS
  cisco.ios.ios_command:
    commands:
      - "show running-config interface {{ my_macsec_interface }}"
  register: macsec_pq_iface
  changed_when: false
  when: state == 'present'

- name: MACsec PQ | abort if the link is keyed by a pre-shared key
  ansible.builtin.assert:
    that:
      - (macsec_pq_iface.stdout[0] | default('')) is not search('mka pre-shared-key')
      - (macsec_pq_iface.stdout[0] | default('')) is search('dot1x pae both')
    fail_msg: >-
      {{ my_macsec_interface }} on {{ inventory_hostname }} is not keyed by EAP-TLS.
      This overlay only means something on top of macsec-eaptls: a pre-shared-key
      session has no handshake for ML-KEM to go into, so these settings would apply and
      change nothing. Tear the PSK down and build the EAP-TLS path first:
      "ansible-playbook macsec-psk.yml -e macsec_play_hosts={{ macsec_play_hosts }}
      -e state=absent" then "ansible-playbook macsec-eaptls.yml
      -e macsec_play_hosts={{ macsec_play_hosts }}".
    quiet: true
  when: state == 'present'

# access-session pqc-type and tls-version are GLOBAL, one setting per box, but sw1
# sits on two MACsec links. Reverting sw1 would un-PQ the router uplink on Gi1/0/3,
# so sw1 has to stay. And if sw1 stays while sw2 reverts, the two ends of the host
# link no longer agree on the EAP-TLS handshake: every MKA session then dies about
# two seconds after it starts, both ends sit "Blocked On: User Profile Application",
# and macsec-eaptls.yml cannot repair it because it never touches these leaves.
#
# So the whole pair is left alone. Teardown here is a deliberate no-op: on this
# topology there is no way to un-PQ the host link without either breaking the router
# uplink or desynchronising the pair.
- name: MACsec PQ | host-to-switch teardown leaves the global leaves alone
  ansible.builtin.debug:
    msg: >-
      Not reverting access-session pqc-type/tls-version on {{ inventory_hostname }}.
      They are global, sw1 shares them with the router uplink on Gi1/0/3, and
      reverting only one end of {{ macsec_play_hosts }} would stop EAP-TLS from
      securing. The link keeps ML-KEM. To take MACsec off this pair entirely, run
      "ansible-playbook macsec-eaptls.yml -e macsec_play_hosts={{ macsec_play_hosts }}
      -e state=absent".
  when:
    - state == 'absent'
    - macsec_h2s_play | bool

- name: MACsec PQ | stop before the global revert on the host-to-switch pair
  ansible.builtin.meta: end_host
  when:
    - state == 'absent'
    - macsec_h2s_play | bool

- name: MACsec PQ | render
  ansible.builtin.set_fact:
    nc_label: >-
      {{ (state == 'present')
         | ternary('access-session pqc-type ' ~ my_macsec_pq_type ~ ', TLS ' ~ pq_macsec_tls_version,
                   'access-session back to classical defaults') }}
    nc_operation: merge
    nc_payload: "{{ lookup('template', 'macsec-pq.xml.j2') }}"

- name: MACsec PQ | push
  ansible.builtin.include_role:
    name: common
    tasks_from: netconf-edit

# The knobs only take effect on the next EAP-TLS handshake. Forcing one is how you avoid
# reading a stale session and concluding nothing happened.
#
# ESCAPE HATCH: network_cli. Exec-mode action, no rpc in the model.
#
# Gated on the push above: an action task is always "changed", so unconditionally
# clearing the session made changed=0 impossible on a second run. It is not free
# either. Clearing the access-session drops the MACsec link and costs roughly two
# minutes of EAP-TLS thrash before it settles, so re-running this playbook to check
# the posture should not knock the link over to tell you nothing moved.
#
# ONE END ONLY, and that is not a detail. On a switch-to-switch link both boxes run
# "dot1x pae both", so each one's supplicant authenticates against the other one's
# authenticator. Clearing both in the same task restarts both on the same instant, and
# with "authentication-restart 7" they then retry on the same 7 second tick forever:
# every attempt reaches a peer that is itself mid-restart. The link never comes back,
# and the logs just loop %DOT1X-5-RESULT_OVERRIDE on one side while the other sits
# Unauthorized with "dot1xSup: Authc Failed". Clearing a single end is enough anyway,
# the whole pair renegotiates and both sides land on a fresh CKN.
- name: MACsec PQ | force a re-authentication so the new handshake is used
  cisco.ios.ios_command:
    commands:
      - "clear access-session interface {{ my_macsec_interface }}"
  when:
    - netconf_edit_result.changed | default(false)
    - macsec_pq_reauth_here
  changed_when: true
  vars:
    # Whichever name sorts first, so the choice is stable across runs. If the peer is
    # not in this play at all there is no one else to do it, so do it here.
    macsec_pq_reauth_here: >-
      {{ (my_macsec_peer not in ansible_play_hosts)
         or (inventory_hostname == ([inventory_hostname, my_macsec_peer] | sort | first)) }}

- name: MACsec PQ | note what to check
  ansible.builtin.debug:
    msg: >-
      Re-authentication forced from one end of the link. A cold EAP-TLS start thrashes
      for around two minutes before it settles, so give it that before believing
      "show mka sessions". And never accept Secured as proof of encryption: check that
      Out Pkts Encrypted is actually moving, which is what verify.yml reports.
  when: netconf_edit_result.changed | default(false)
  run_once: true

- name: MACsec PQ | save
  ansible.builtin.include_role:
    name: common
    tasks_from: save-config
