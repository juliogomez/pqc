---
# MACsec with a pre-shared key. Quantum-safe by having no key exchange at all.
#
# The honest baseline for MACsec: nothing for a quantum computer to break, because
# nothing is negotiated. The CAK is typed in at both ends and MKA derives the
# per-frame key from it. Also the reason it is a dead end: one static secret on
# two devices, no forward secrecy, and if it leaks every frame past and future is
# readable until someone rotates it by hand.
#
# C9300 TOPOLOGY: three links, all network-link (not access-port macsec), and you
# pick one per run with -e macsec_play_hosts=:
#   macsec_s2r  sw1 ↔ rtr1  switch-to-router
#   macsec_s2s      hx1 ↔ hx2   switch-to-switch on Te1/0/6 (the IPsec underlay too)
#   macsec_h2s     sw1 ↔ sw2   host-to-switch
#
# STANDALONE DEAD END. macsec-pq stacks on macsec-eaptls, not on this. Tear this
# down before building the EAP-TLS path, or the port carries two conflicting key
# sources.
#
# NOT IDEMPOTENT on teardown. Removing "macsec network-link" from a live interface
# drops the secure channel immediately, and IOS XE will not let you change the
# MACsec mode in place: you have to take it off before you can put a different one
# on. So the teardown genuinely changes the state of the wire.
#
# THE BUILD DIRECTION IS IDEMPOTENT, AND IT COSTS SOMETHING. Read the comment on
# "Look for an existing key chain" below before you change anything here.

- name: MACsec PSK | skip devices with no management address
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/skip-unaddressed.yml"

- name: MACsec PSK | both ends of the link must be reachable
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/assert-link-manageable.yml"

- name: MACsec PSK | sanity
  ansible.builtin.assert:
    that:
      - my_macsec_interface | length > 0
      - lab_macsec_cak | default('') | length > 0
      - lab_macsec_cak is match('^[0-9A-Fa-f]+$')
      - (lab_macsec_cak | length) == ((macsec_key_algorithm == 'aes-256-cmac') | ternary(64, 32))
    fail_msg: >-
      lab_macsec_cak must be hex and exactly
      {{ (macsec_key_algorithm == 'aes-256-cmac') | ternary(64, 32) }} characters for
      {{ macsec_key_algorithm }}, and the same value on both ends. Generate one with
      "openssl rand -hex {{ (macsec_key_algorithm == 'aes-256-cmac') | ternary(32, 16) }}".
      It IS the CAK, so keep it out of git.
    quiet: true

- name: MACsec PSK | build
  when: state == 'present'
  block:

    # Fail before creating the global PSK policy or key chain. A failed
    # precondition must not leave partial PSK objects behind.
    - name: Probe for leftover EAP-TLS on the MACsec interface
      cisco.ios.ios_command:
        commands:
          - "show running-config interface {{ my_macsec_interface }}"
      register: macsec_psk_intf_probe
      changed_when: false

    - name: Refuse to stack PSK on an EAP-TLS interface
      ansible.builtin.assert:
        that:
          - not (macsec_psk_intf_probe.stdout[0] | default('') is search('access-session closed'))
          - not (macsec_psk_intf_probe.stdout[0] | default('') is search('dot1x pae'))
          - not (macsec_psk_intf_probe.stdout[0] | default('') is search('mka policy ' ~ macsec_names.eaptls_mka_policy))
        fail_msg: >-
          {{ inventory_hostname }} still has EAP-TLS MACsec on {{ my_macsec_interface }}.
          PSK and EAP-TLS use the same port with different key sources and will not
          negotiate together. Tear the EAP-TLS chain down first:
            ansible-playbook macsec-pq.yml -e macsec_play_hosts={{ macsec_play_hosts }} -e state=absent
            ansible-playbook macsec-eaptls.yml -e macsec_play_hosts={{ macsec_play_hosts }} -e state=absent
          then re-run:
            ansible-playbook macsec-psk.yml -e macsec_play_hosts={{ macsec_play_hosts }}
        quiet: true

    # WHY THIS PROBE EXISTS. Re-running this role used to FAIL because the box
    # stores the CAK encrypted. Once it has, the running config reads
    # "key-string 7 <type-7 blob>", and the NETCONF-to-CLI layer renders our
    # PLAINTEXT hex against the "7" it finds on the existing leaf. The parser
    # rejects "key-string 7 <plaintext hex>" with "Rejecting: Key must consist of
    # hex digits".
    #
    # So: push the key-string exactly once, on the run that creates the key chain.
    #
    # THE HONEST COST. A CAK you rotate in group_vars will NOT be applied to a box
    # that already has this key chain. To rotate the CAK:
    #
    #   ansible-playbook macsec-psk.yml -e macsec_play_hosts=<group> -e state=absent -e macsec_psk_remove_globals=true
    #   ansible-playbook macsec-psk.yml -e macsec_play_hosts=<group>
    - name: Inspect the existing PSK objects
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^key chain {{ macsec_names.psk_key_chain }}"
          - "show mka policy {{ macsec_names.psk_mka_policy }}"
      register: macsec_psk_objects_probe
      changed_when: false

    - name: Record whether the PSK objects already match
      ansible.builtin.set_fact:
        # Anchored and multiline, because "| include" can return more than one line.
        # Trailing (\s|$) so PQAUTO-MACSEC-KC does not match a longer name.
        macsec_psk_keychain_exists: >-
          {{ (macsec_psk_objects_probe.stdout[0] | default(''))
             is search('^key chain ' ~ macsec_names.psk_key_chain ~ '(\s|$)', multiline=True) }}
        macsec_psk_policy_matches: >-
          {{ (macsec_psk_objects_probe.stdout[1] | default(''))
             is search(macsec_names.psk_mka_policy ~ '\s+.*'
                       ~ (macsec_cipher_suite | upper)) }}

    - name: Say plainly that the stored CAK is being left alone
      ansible.builtin.debug:
        msg: >-
          Key chain {{ macsec_names.psk_key_chain }} already exists on
          {{ inventory_hostname }}, so the key-string was NOT pushed and the CAK
          currently on the box is untouched. IOS XE stores it encrypted, so a
          rotated lab_macsec_cak cannot be compared or applied here. To rotate it:
          "ansible-playbook macsec-psk.yml -e macsec_play_hosts={{ macsec_play_hosts }}
          -e state=absent -e macsec_psk_remove_globals=true" and then
          "ansible-playbook macsec-psk.yml -e macsec_play_hosts={{ macsec_play_hosts }}".
      when: macsec_psk_keychain_exists | bool

    - name: Render MKA policy and key chain
      ansible.builtin.set_fact:
        nc_label: >-
          MKA policy {{ macsec_names.psk_mka_policy }} and key chain
          {{ macsec_names.psk_key_chain }}
          {{ macsec_psk_keychain_exists | bool | ternary('(key-string skipped, chain exists)', '(with key-string)') }}
        nc_operation: merge
        nc_payload: "{{ lookup('template', 'psk-globals.xml.j2') }}"
      vars:
        macsec_psk_push_key_string: "{{ not (macsec_psk_keychain_exists | bool) }}"

    - name: Push MKA policy and key chain
      ansible.builtin.include_role:
        name: common
        tasks_from: netconf-edit
      when:
        - not (macsec_psk_keychain_exists | bool)
          or not (macsec_psk_policy_matches | bool)

    - name: Isolated VLAN and SVI (host-to-switch only)
      ansible.builtin.include_role:
        name: common
        tasks_from: macsec-l2

    - name: Apply MACsec PSK to the interface
      cisco.ios.ios_config:
        parents: "interface {{ my_macsec_interface }}"
        lines:
          - "{{ my_macsec_mode_line }}"
          - "mka policy {{ macsec_names.psk_mka_policy }}"
          - "mka pre-shared-key key-chain {{ macsec_names.psk_key_chain }}"

    - name: Save
      ansible.builtin.include_role:
        name: common
        tasks_from: save-config

# --- Teardown ----------------------------------------------------------------
#
# The interface config comes off; the global MKA policy and key chain stay. Once
# they are off the interface they cannot interfere, and leaving them means the next
# build is a one-line change. Pass -e macsec_psk_remove_globals=true if you want
# them gone too (also the CAK rotation path).
- name: MACsec PSK | tear down
  when: state == 'absent'
  block:

    - name: Remove MACsec PSK from the interface
      cisco.ios.ios_config:
        parents: "interface {{ my_macsec_interface }}"
        lines:
          - "no mka pre-shared-key key-chain {{ macsec_names.psk_key_chain }}"
          - "no mka policy {{ macsec_names.psk_mka_policy }}"
          - "no {{ my_macsec_mode_line }}"
      # Order matters: take the key source off before the MACsec mode, so the port
      # is never sitting in network-link mode with nothing to key it.

    - name: Isolated VLAN and SVI teardown (host-to-switch only)
      ansible.builtin.include_role:
        name: common
        tasks_from: macsec-l2-absent

    - name: Remove the global MKA policy and key chain
      when: macsec_psk_remove_globals | default(false) | bool
      block:

        - name: Render removal
          ansible.builtin.set_fact:
            nc_label: remove MKA policy and key chain
            nc_operation: none
            nc_payload: "{{ lookup('template', 'psk-globals.xml.j2') }}"

        - name: Push removal
          ansible.builtin.include_role:
            name: common
            tasks_from: netconf-edit

    - name: Save
      ansible.builtin.include_role:
        name: common
        tasks_from: save-config
