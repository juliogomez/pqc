---
# Tear the IKEv2 SAs down so the next packet renegotiates, then send that packet.
#
# ESCAPE HATCH: network_cli. Cisco-IOS-XE-crypto contains zero rpc statements, so
# there is no modelled action for this. Config is fully modelled; verbs are not.
#
# Why it is needed at all: changing a proposal or an authentication method does
# not touch an SA that is already up. Without this, you push ML-KEM, run verify,
# see pqc-gt-none, and conclude the feature is broken when it simply has not been
# renegotiated yet.
#
# C9300 IPsec has a single peer (sw1 <-> sw2), so there is exactly one peer to
# re-trigger. Simpler than C8000's hub-spoke loop.
#
# Deliberately non-fatal. Between one end switching and the other following, the
# peers genuinely disagree and the tunnel is genuinely down. A ping that fails in
# that window is the documented behaviour, not an error.

- name: Clear IKEv2 SAs
  cisco.ios.ios_command:
    commands:
      - clear crypto ikev2 sa
  changed_when: true

- name: Re-trigger the tunnel so a new SA is negotiated
  cisco.ios.ios_command:
    commands:
      - "ping {{ my_ipsec.peer_loopback | default('') }} source {{ my_ipsec.tunnel_address | default('') }} repeat 5"
  register: reneg_ping
  until: (reneg_ping.stdout[0] | default('')) is not search('Success rate is 0 percent')
  retries: 6
  delay: 5
  failed_when: false
  changed_when: false
  when: my_ipsec | length > 0
