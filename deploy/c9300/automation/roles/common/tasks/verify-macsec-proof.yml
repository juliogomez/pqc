---
# Operational proof that MACsec is secured, keyed the way this playbook claims,
# and encrypting right now.
#
# Mirrors the C8000 verify-macsec-proof: a separate play after the build role,
# named tasks, assert with a plain-language fail_msg, debug report with
# changed_when: true so it shows up under display_ok_hosts = false.
#
# Required var: macsec_proof_keying = psk | eaptls | pq
#
# macsec_proof_keying says what the playbook set out to build, and drives which
# assertions run. It does NOT decide the scenario printed in the summary. That is
# read back off the box, the same way roles/verify does it, so the two can never
# disagree. They used to: macsec-eaptls.yml would report "eaptls" on a link that
# still had access-session pqc-type from an earlier macsec-pq.yml run, because
# nothing in the EAP-TLS path clears those global leaves.
#
# CKN is the cheap fingerprint:
#   PSK     -> "01" (key-chain key ID, not negotiated)
#   EAP-TLS -> 32 hex chars (MSK-derived, new every re-auth)
#   PQ      -> same CKN shape as EAP-TLS; pqc-type leaf proves ML-KEM intent

- name: "MACsec proof | {{ inventory_hostname }} | skip devices with no management address"
  ansible.builtin.include_tasks: skip-unaddressed.yml

- name: "MACsec proof | {{ inventory_hostname }} | far end of the MACsec link"
  ansible.builtin.set_fact:
    macsec_proof_peer: "{{ my_macsec_peer | default('') }}"
    macsec_proof_delta_pings: "{{ verify_macsec_delta_pings | default(20) }}"

# Ping the address that actually crosses this hop. OOB management does not
# increment Out Pkts Encrypted. HX uses the Te1/0/6 underlay; sw1/rtr1 fall
# back to lab_mgmt when there is no routed address on the MACsec port.
- name: "MACsec proof | {{ inventory_hostname }} | peer address for delta ping"
  ansible.builtin.set_fact:
    macsec_proof_peer_address: "{{ my_macsec_peer_address | default('') }}"

- name: "MACsec proof | {{ inventory_hostname }} | wait for MKA to secure"
  cisco.ios.ios_command:
    commands:
      - "show mka sessions interface {{ my_macsec_interface }}"
  register: macsec_proof_mka_wait
  until:
    - macsec_proof_mka_wait.stdout[0] | default('') is search('\sSecured\s')
    - >-
      (macsec_proof_keying | default('') not in ['eaptls', 'pq'])
      or (macsec_proof_mka_wait.stdout[0] | default('')
          is search(macsec_names.eaptls_mka_policy))
  retries: "{{ macsec_proof_settle_retries | default(18) }}"
  delay: "{{ macsec_proof_settle_delay | default(5) }}"
  changed_when: false

# Always, not just on the pq path. These two global leaves are what separates an
# EAP-TLS link from an ML-KEM one, and the EAP-TLS and PSK paths never touch them,
# so they are exactly the thing a run cannot assume.
- name: "MACsec proof | {{ inventory_hostname }} | configured PQ leaves"
  block:
    - name: "MACsec proof | {{ inventory_hostname }} | fetch access-session settings"
      ansible.builtin.include_tasks: netconf-fetch.yml
      vars:
        nc_label: access-session pqc-type / tls-version
        nc_source: running
        nc_filter: |
          <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
            <access-session xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-sanet"/>
          </native>

    - name: "MACsec proof | {{ inventory_hostname }} | record access-session settings"
      ansible.builtin.set_fact:
        macsec_proof_pqc_type: >-
          {{ ((netconf_fetch_result.stdout | default(''))
              | regex_findall('<pqc-type>([^<]+)</pqc-type>') + ['(default: non-pqc)'])
             | first }}
        macsec_proof_tls_version: >-
          {{ ((netconf_fetch_result.stdout | default(''))
              | regex_findall('<tls-version>([^<]+)</tls-version>') + ['(default: all)'])
             | first }}
        macsec_proof_expected_pqc_type: "{{ my_macsec_pq_type }}"
        macsec_proof_expected_tls_version: "{{ pq_macsec_tls_version }}"

# The state and stats commands differ between the switches and the router, so they
# come from my_macsec_show_state / my_macsec_show_stats (group_vars/all/topology.yml).
# On a C9300 both resolve to "show macsec interface", which carries everything; on a
# C8000 they are the separate status and statistics commands. Running both regardless
# keeps stdout indexes the same on every platform.
#
# Scope MKA to this hop: hx1 already has a leftover secured session on Te1/0/5, and a
# box-wide "Secured Sessions" count would wait-succeed on the wrong port.
- name: "MACsec proof | {{ inventory_hostname }} | MKA and MACsec state"
  cisco.ios.ios_command:
    commands:
      - "show mka sessions interface {{ my_macsec_interface }}"
      - "{{ my_macsec_show_state }}"
      - "{{ my_macsec_show_stats }}"
  register: macsec_proof_show
  changed_when: false
  failed_when: false

- name: "MACsec proof | {{ inventory_hostname }} | parse show output"
  ansible.builtin.set_fact:
    macsec_proof_mka_secured: >-
      {{ 1 if (macsec_proof_show.stdout[0] | default('')) is search('\sSecured\s') else 0 }}
    macsec_proof_cipher: >-
      {{ ((macsec_proof_show.stdout[1] | default(''))
          | regex_findall('Cipher\s*:\s*(\S+)') + ['(none)']) | first }}
    macsec_proof_transmitting: >-
      {{ (macsec_proof_show.stdout[1] | default('')) is search(my_macsec_transmitting_pattern) }}
    macsec_proof_encrypted_out: "{{ _enc | int }}"
    macsec_proof_ckn: >-
      {{ ((macsec_proof_show.stdout[0] | default(''))
          | regex_findall('Secured\s+([0-9A-Fa-f]{2,32})') + ['(none)']) | first }}
    macsec_proof_enabled: >-
      {{ (macsec_proof_show.stdout[1] | default('')) is search(my_macsec_enabled_pattern) }}
  vars:
    # SA Statistics, NOT SC Statistics, and not the max of the two.
    #
    # The transmit secure channel reports "Encrypted Pkts" twice:
    #
    #   SC Statistics
    #    Encrypted Pkts : 735     <- channel aggregate, and it does not move
    #   SA Statistics
    #    Encrypted Pkts : 98      <- the live one, +20 per 20 pings
    #
    # Taking the max reads the frozen aggregate every time, so the delta is
    # always 0 and the proof fails on a link that is demonstrably encrypting.
    # Anchoring on "SA Statistics" picks the live counter. The receive channel's
    # SA block counts "Valid pkts", not "Encrypted Pkts", so the first match is
    # always the transmit one.
    #
    # default([0], true) has to come BEFORE first. regex_search returns None when
    # nothing matches, which it does whenever the SA is down (mid-reauth, or right
    # after a teardown), and "None | first" is a hard error.
    _enc: >-
      {{ (macsec_proof_show.stdout[2] | default(''))
         | regex_search(my_macsec_encrypted_pattern, '\1')
         | default([0], true) | first }}

- name: "MACsec proof | {{ inventory_hostname }} | push frames across the secured link"
  cisco.ios.ios_command:
    commands:
      - "ping {{ macsec_proof_peer_address }} repeat {{ macsec_proof_delta_pings }}"
  register: macsec_proof_ping
  changed_when: false
  failed_when: false
  when:
    - macsec_proof_enabled | bool
    - macsec_proof_peer_address | length > 0

- name: "MACsec proof | {{ inventory_hostname }} | second counter read"
  cisco.ios.ios_command:
    commands:
      - "{{ my_macsec_show_stats }}"
  register: macsec_proof_show2
  changed_when: false
  failed_when: false
  when: macsec_proof_enabled | bool

- name: "MACsec proof | {{ inventory_hostname }} | record second counter read"
  ansible.builtin.set_fact:
    macsec_proof_encrypted_out_2: "{{ _enc2 | int }}"
    macsec_proof_ping_success: >-
      {{ ((macsec_proof_ping.stdout[0] | default(''))
          | regex_findall('Success rate is [0-9]+ percent \(([0-9]+)/') + ['0']) | first }}
  vars:
    # Same SA-not-SC counter as the first read. Both must parse identically or
    # the delta is meaningless.
    _enc2: >-
      {{ (macsec_proof_show2.stdout[0] | default(''))
         | regex_search(my_macsec_encrypted_pattern, '\1')
         | default([0], true) | first }}
  when: macsec_proof_enabled | bool

- name: "MACsec proof | {{ inventory_hostname }} | compute encryption delta"
  ansible.builtin.set_fact:
    macsec_proof_encrypted_delta: >-
      {{ (macsec_proof_encrypted_out_2 | int) - (macsec_proof_encrypted_out | int) }}
  when: macsec_proof_enabled | bool

- name: "MACsec proof | {{ inventory_hostname }} | MACsec is enabled on the interface"
  ansible.builtin.assert:
    that:
      - macsec_proof_enabled | bool
    fail_msg: >-
      MACsec is not enabled on {{ my_macsec_interface }} on {{ inventory_hostname }}.
      The build role may not have finished, or this box is mid-teardown.
    quiet: true

- name: "MACsec proof | {{ inventory_hostname }} | secured, transmitting, and encrypting now"
  ansible.builtin.assert:
    that:
      - macsec_proof_mka_secured | int > 0
      - macsec_proof_transmitting | bool
      - macsec_proof_encrypted_delta | default(-1) | int > 0
    fail_msg: >-
      {{ inventory_hostname }} is not secured and encrypting on {{ my_macsec_interface }}.
      Secured sessions {{ macsec_proof_mka_secured | default('0') }}, transmitting
      {{ macsec_proof_transmitting | default(false) }}, Out Pkts Encrypted
      {{ macsec_proof_encrypted_out | default('0') }} ->
      {{ macsec_proof_encrypted_out_2 | default('(not sampled)') }}, delta
      {{ macsec_proof_encrypted_delta | default('(not sampled)') }} across
      {{ macsec_proof_delta_pings }} pings to {{ macsec_proof_peer_address }} of which
      {{ macsec_proof_ping_success | default('0') }} succeeded. A zero delta with a
      non-zero cumulative count means the link encrypted in the past and is idle or broken
      now. A zero delta with zero cumulative is the plain "macsec" instead of
      "macsec network-link" trap. A NEGATIVE delta is neither: the SA rotated between the
      two reads, so re-run and it will pass.
    success_msg: >-
      {{ inventory_hostname }}: MKA Secured, transmitting, Out Pkts Encrypted delta
      {{ macsec_proof_encrypted_delta }} across {{ macsec_proof_delta_pings }} pings
    quiet: true

- name: "MACsec proof | {{ inventory_hostname }} | CKN matches pre-shared keying"
  ansible.builtin.assert:
    that:
      - macsec_proof_ckn | upper == '01'
    fail_msg: >-
      Expected a PSK session (CKN 01) on {{ inventory_hostname }}, got CKN
      {{ macsec_proof_ckn | default('(none)') }}. A 32-character hex CKN means EAP-TLS
      is still active. Tear it down with "ansible-playbook macsec-eaptls.yml
      -e macsec_play_hosts={{ macsec_play_hosts }} -e state=absent" before running
      macsec-psk.yml, or leave it alone if you meant to be on certificates.
    success_msg: "CKN 01: static CAK from the key chain, not an EAP-TLS MSK"
    quiet: true
  when: macsec_proof_keying == 'psk'

- name: "MACsec proof | {{ inventory_hostname }} | CKN matches EAP-TLS keying"
  ansible.builtin.assert:
    that:
      - macsec_proof_ckn is match('^[0-9A-Fa-f]{32}$')
    fail_msg: >-
      Expected a 32-character hex CKN from EAP-TLS on {{ inventory_hostname }}, got
      {{ macsec_proof_ckn | default('(none)') }}. CKN 01 means the link is still on
      macsec-psk.yml. Tear it down with "ansible-playbook macsec-psk.yml
      -e macsec_play_hosts={{ macsec_play_hosts }} -e state=absent", then run
      macsec-eaptls.yml with the same macsec_play_hosts value.
    success_msg: >-
      CKN {{ macsec_proof_ckn }}: MSK-derived, not the static PSK id 01
    quiet: true
  when: macsec_proof_keying == 'eaptls'

- name: "MACsec proof | {{ inventory_hostname }} | PQ leaves match pqc.yml"
  ansible.builtin.assert:
    that:
      - macsec_proof_pqc_type == macsec_proof_expected_pqc_type
      - macsec_proof_tls_version == macsec_proof_expected_tls_version
      - macsec_proof_ckn is match('^[0-9A-Fa-f]{32}$')
    fail_msg: >-
      {{ inventory_hostname }} PQ MACsec mismatch. Configured access-session pqc-type
      {{ macsec_proof_pqc_type | default('(unread)') }} (expected
      {{ macsec_proof_expected_pqc_type }}), tls-version
      {{ macsec_proof_tls_version | default('(unread)') }} (expected
      {{ macsec_proof_expected_tls_version }}), CKN
      {{ macsec_proof_ckn | default('(none)') }} (expected 32 hex chars from EAP-TLS).
    success_msg: >-
      access-session pqc-type {{ macsec_proof_pqc_type }}, tls-version
      {{ macsec_proof_tls_version }}, EAP-TLS CKN present
    quiet: true
  when: macsec_proof_keying == 'pq'

- name: "MACsec proof | {{ inventory_hostname }} | operational summary"
  ansible.builtin.debug:
    msg: "{{ macsec_proof_summary }}"
  changed_when: true
  vars:
    # Same classification as roles/verify/tasks/main.yml, deliberately. CKN shape
    # separates PSK from EAP-TLS, and the pqc-type leaf separates EAP-TLS from
    # ML-KEM. Keep the two in step if you change either.
    macsec_proof_scenario: >-
      {%- if not (macsec_proof_enabled | default(false) | bool) -%}none
      {%- elif (macsec_proof_ckn | default('') | upper) == '01' -%}psk
      {%- elif macsec_proof_ckn | default('') is match('^[0-9A-Fa-f]{32}$') -%}
      {%- if macsec_proof_pqc_type | default('') in [my_macsec_pq_type, 'hybrid'] -%}eaptls-mlkem
      {%- else -%}eaptls{%- endif -%}
      {%- else -%}unknown{%- endif -%}
    macsec_proof_summary: >-
      {{ inventory_hostname }}
      | if={{ my_macsec_interface | default('(none)') }}
      | peer={{ my_macsec_peer | default('(none)') }}
      | scenario={{ macsec_proof_scenario }}
      | health=PASS
      | mka_secured={{ macsec_proof_mka_secured | default('0') }}
      | transmitting={{ macsec_proof_transmitting | default(false) }}
      | encrypt_delta={{ macsec_proof_encrypted_delta | default('(not sampled)') }}
      | ckn={{ macsec_proof_ckn | default('(none)') }}
      | pqc_type={{ macsec_proof_pqc_type | default('(unread)') }}
      {{- (' | note=built as ' ~ macsec_proof_keying ~ ', but the box is running '
           ~ macsec_proof_scenario ~ '; run macsec-pq.yml -e macsec_play_hosts='
           ~ macsec_play_hosts ~ ' -e state=absent to go back')
          if (macsec_proof_keying == 'eaptls' and macsec_proof_scenario == 'eaptls-mlkem')
          else '' -}}
