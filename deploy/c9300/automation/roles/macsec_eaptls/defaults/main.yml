---
# No key size or subject name here any more. The role does not generate a
# certificate: it reuses the self-signed one the device shipped with, because
# IOS XE allows a single self-signed trustpoint per box and enrolling a second
# deletes the first. See roles/macsec_eaptls/tasks/cert-identity.yml.
#
# That certificate is RSA-2048, and authentication on this path stays RSA-2048 on
# 26.2 either way. The ML-KEM part of EAP-TLS is the key exchange inside the TLS
# 1.3 handshake, not the certificate. macsec-pq turns that on; nothing here makes
# the signature quantum-safe.

# How long to give EAP-TLS to settle after the interface is closed.
#
# A cold start thrashes: both ends come up as supplicant and authenticator at once,
# both start a handshake, one loses, EAPOL retries. Measured at roughly 120 seconds
# before the session settles into Secured. Fail-fast here reports a broken build
# that is merely mid-negotiation, so wait.
macsec_eaptls_settle_retries: 18
macsec_eaptls_settle_delay: 10

# Whether the teardown removes the two local usernames that carry the linksec
# attribute list. Off by default: those lines are "no username", the identities are
# unprefixed because they are EAP identity strings rather than objects this layer
# names, and the cost of getting a "no username" wrong on a remotely managed box is
# console recovery.
macsec_eaptls_remove_identity_user: false
